                      section: profile
                      exists: true
                      allowed: true
                      is_friend: true
                      is_blocked: false
                    - owner_id: 11111111-1111-4111-8111-111111111111
                      section: collection
                      exists: true
                      allowed: true
                      is_friend: true
                      is_blocked: false
        '400':
