      description: Доступно Collection, Community, Catalog и Moderation. В Authorization передаётся служебный
        секрет, в теле — пользовательский access. Валидный токен и активная серверная сессия дают active=true
        и user_id; пустой, неверный, просроченный токен или недействующая сессия — 200 с active=false без user_id.
        Роль не выдаётся. Сбой БД возвращает 503, а не active=false. Это проверка личности, не разрешение на
        конкретный ресурс.
      operationId: introspectAccessToken
      security:
      - ServiceBearer: []
      x-allowed-services:
      - collection
      - community
      - catalog
      - moderation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntrospectRequest'
            example:
              access_token: <user_access_token>
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
              examples:
                success:
                  value:
                    active: true
                    user_id: 11111111-1111-4111-8111-111111111111
                alternative:
