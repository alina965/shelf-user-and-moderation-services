openapi: 3.0.3
info:
  title: User Service API
  version: 1.0.0
  description: 'Реализованные эндпоинты User Service (Go + Gin). Прямые пути сервиса не содержат /api/v1: внешний
    префикс добавляет Gateway. Внутренние /internal/* доступны только доверенным сервисам, закрываются от внешнего
    Gateway и при развёртывании вызываются по TLS. Сообщения исключены из MVP.


    Каждый ответ содержит сгенерированный сервером X-Request-ID; прикладные ошибки дублируют его в request_id.
    Входящий X-Request-ID не используется. Ответ 204 не содержит тела. Неизвестные маршруты и аварийные ответы
    Gin могут иметь иной формат.


    Проверка доступа учитывает текущую серверную сессию, приватность, дружбу и блокировки. Ошибка обязательной
    проверки означает отказ в выдаче закрытых данных; положительные решения не следует кэшировать между запросами.
    Для внутреннего JSON допустим один объект до 1 МиБ, неизвестные поля запрещены (INVALID_JSON).


    Строки email, username и identifier обрезаются по краям до валидации; ограничения в описаниях относятся
    к нормализованному значению. Пароли не обрезаются и не нормализуются.'
servers:
- url: http://localhost:8080
  description: Прямой локальный адрес User Service без Gateway.
tags:
- name: Авторизация
- name: Пользователи
- name: Заявки и дружба
- name: Блокировки
- name: Внутреннее API
- name: Состояние сервиса
security: []
paths:
  /auth/register:
    post:
      tags:
      - Авторизация
      summary: Регистрация
      description: Регистрация без подтверждения почты. Возвращает user_id; токены выдаются отдельным входом.
        Privacy профиля и разделов создаётся со значением public. Ошибки всех полей возвращаются в error.fields.
        При сочетании ошибок формата и уникальности — 400 INVALID_REGISTRATION со всеми полями; если нарушена
        только уникальность — 409 ACCOUNT_EXISTS.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: anna@example.com
              username: Anna
              password: ExamplePass123!
              password_confirmation: ExamplePass123!
      responses:
        '201':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                success:
                  value:
                    user_id: 11111111-1111-4111-8111-111111111111
        '400':
          description: 'Возможные error.code: `INVALID_JSON`, `INVALID_REGISTRATION`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                INVALID_JSON:
                  $ref: '#/components/examples/INVALID_JSON'
                INVALID_REGISTRATION:
                  $ref: '#/components/examples/INVALID_REGISTRATION'
        '409':
          description: 'Возможные error.code: `ACCOUNT_EXISTS`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                ACCOUNT_EXISTS:
                  $ref: '#/components/examples/ACCOUNT_EXISTS'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags:
      - Авторизация
      summary: Вход
      description: Вход по email или username. Каждый успешный вход создаёт отдельную серверную сессию. Пять
        последовательных неверных попыток по нормализованному идентификатору блокируют вход на 1 час, включая
        несуществующий аккаунт. Email и имя имеют независимые счётчики. Неверный формат даёт INVALID_LOGIN
        без увеличения счётчика; успешный вход сбрасывает счётчик. После блокировки или часового перерыва начинается
        новый отсчёт. Клиент хранит пару токенов и использует expires_in. При редком исчезновении профиля во
        время входа возможен PROFILE_NOT_FOUND.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              identifier: anna@example.com
              password: ExamplePass123!
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  value:
                    access_token: <access_token>
                    refresh_token: <refresh_token>
                    expires_in: 899
                    user:
                      id: 11111111-1111-4111-8111-111111111111
                      email: anna@example.com
                      username: Anna
                      avatar_url: null
                      banner_url: null
                      description: null
                      friends_count: 0
                      privacy:
                        profile_visibility: public
                        description_visibility: public
                        friends_visibility: public
                        communities_visibility: public
        '400':
          description: 'Возможные error.code: `INVALID_JSON`, `INVALID_LOGIN`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                INVALID_JSON:
                  $ref: '#/components/examples/INVALID_JSON'
                INVALID_LOGIN:
                  $ref: '#/components/examples/INVALID_LOGIN'
        '401':
          description: 'Возможные error.code: `BAD_CREDENTIALS`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                BAD_CREDENTIALS:
                  $ref: '#/components/examples/BAD_CREDENTIALS'
        '404':
          description: 'Возможные error.code: `PROFILE_NOT_FOUND`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                PROFILE_NOT_FOUND:
                  $ref: '#/components/examples/PROFILE_NOT_FOUND'
        '429':
          description: 'Возможные error.code: `LOGIN_LOCKED`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                LOGIN_LOCKED:
                  $ref: '#/components/examples/LOGIN_LOCKED'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      tags:
      - Авторизация
      summary: Обновить токены
      description: Транзакционная ротация refresh в исходной сессии. Старый refresh удаляется и повторно даёт
        INVALID_REFRESH_TOKEN; срок сессии не продлевается. Access, выпущенный в ту же секунду, может совпасть
        строково с прежним. Если запись refresh уже удалена, INVALID_REFRESH_TOKEN может вернуться и после
        отзыва сессии. Сроки задаются ACCESS_TOKEN_TTL и REFRESH_TOKEN_TTL.
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: <refresh_token>
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
              examples:
                success:
                  value:
                    access_token: <new_access_token>
                    refresh_token: <new_refresh_token>
                    expires_in: 899
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          description: 'Возможные error.code: `INVALID_REFRESH_TOKEN`, `SESSION_REVOKED`, `SESSION_EXPIRED`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                INVALID_REFRESH_TOKEN:
                  $ref: '#/components/examples/INVALID_REFRESH_TOKEN'
                SESSION_REVOKED:
                  $ref: '#/components/examples/SESSION_REVOKED'
                SESSION_EXPIRED:
                  $ref: '#/components/examples/SESSION_EXPIRED'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags:
      - Авторизация
      summary: Выйти из текущей сессии
      description: Отзывает только текущую сессию, другие устройства остаются активными. Клиент удаляет локальные
        токены. Ещё не истёкший access этой сессии и её действующий refresh после выхода отклоняются как SESSION_REVOKED.
        Повторный logout также отклоняется; истёкший JWT сначала даёт UNAUTHORIZED. Тело не требуется.
      operationId: logout
      security:
      - UserBearer: []
      responses:
        '204':
          description: Успех. Тело ответа отсутствует.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '401':
          $ref: '#/components/responses/UserSessionError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me:
    get:
      tags:
      - Пользователи
      summary: Собственный профиль
      description: 'Полный собственный профиль: email, описание, число друзей и сохранённая privacy. description
        и friends_count присутствуют независимо от приватности; description может быть null. avatar_url и banner_url
        пока null. Публичного API изменения профиля/приватности нет.'
      operationId: getOwnProfile
      security:
      - UserBearer: []
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProfile'
              examples:
                success:
                  value:
                    id: 11111111-1111-4111-8111-111111111111
                    email: anna@example.com
                    username: Anna
                    avatar_url: null
                    banner_url: null
                    description: null
                    friends_count: 0
                    privacy:
                      profile_visibility: public
                      description_visibility: public
                      friends_visibility: public
                      communities_visibility: public
        '401':
          $ref: '#/components/responses/UserSessionError'
        '404':
          description: 'Возможные error.code: `PROFILE_NOT_FOUND`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                PROFILE_NOT_FOUND:
                  $ref: '#/components/examples/PROFILE_NOT_FOUND'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /users:
    get:
      tags:
      - Пользователи
      summary: Поиск пользователей
      description: Публичный поиск только по username, без email и описания. Переданный Authorization здесь
        не проверяется и на результат не влияет. Закрытые профили сохраняют публичную карточку. При смене q
        клиент сбрасывает cursor и отбрасывает запоздавшие ответы. Курсор связан с нормализованным q; пагинация
        не фиксирует снимок БД между страницами.
      operationId: searchUsers
      security: []
      parameters:
      - name: q
        in: query
        required: true
        description: Поиск по username без регистра. После trim минимум 2 символа. Полное совпадение, затем
          начало имени, затем другое вхождение; внутри группы имя без регистра и UUID. Символы %, _ и обратная
          косая черта считаются буквально.
        schema:
          type: string
        example: anna
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
              examples:
                success:
                  value:
                    items:
                    - id: 11111111-1111-4111-8111-111111111111
                      username: Anna
                      avatar_url: null
                    next_cursor: null
        '400':
          description: 'Возможные error.code: `QUERY_REQUIRED`, `QUERY_TOO_SHORT`, `INVALID_LIMIT`, `INVALID_CURSOR`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                QUERY_REQUIRED:
                  $ref: '#/components/examples/QUERY_REQUIRED'
                QUERY_TOO_SHORT:
                  $ref: '#/components/examples/QUERY_TOO_SHORT'
                INVALID_LIMIT:
                  $ref: '#/components/examples/INVALID_LIMIT'
                INVALID_CURSOR:
                  $ref: '#/components/examples/INVALID_CURSOR'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{id}:
    get:
      tags:
      - Пользователи
      summary: Профиль по ID
      description: 'Можно вызвать без токена как гость. Если Authorization передан, JWT и сессия проверяются;
        ошибочный токен не превращается в гостевой доступ. Сначала проверяется профиль целиком, затем отдельные
        разделы. Владелец видит собственные поля; public доступно всем; friends требует дружбы без блокировки
        в любую сторону; private доступно только владельцу. Закрытый профиль отвечает 200 с is_private=true
        и без description/friends_count. Email и privacy здесь не выдаются, даже владельцу. Нет списков коллекций
        и сообществ: ими владеют Collection и Community.'
      operationId: getUserProfile
      security:
      - {}
      - UserBearer: []
      parameters:
      - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
              examples:
                success:
                  value:
                    id: 11111111-1111-4111-8111-111111111111
                    username: Anna
                    avatar_url: null
                    banner_url: null
                    is_private: false
                    description: Люблю книги и кино
                    friends_count: 0
                alternative:
                  value:
                    id: 11111111-1111-4111-8111-111111111111
                    username: Anna
                    avatar_url: null
                    banner_url: null
                    is_private: true
        '401':
          $ref: '#/components/responses/NoStoreUserSessionError'
        '404':
          description: 'Возможные error.code: `PROFILE_NOT_FOUND`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                PROFILE_NOT_FOUND:
                  $ref: '#/components/examples/PROFILE_NOT_FOUND'
        '503':
          $ref: '#/components/responses/NoStoreServiceUnavailable'
        '500':
          $ref: '#/components/responses/NoStoreInternalError'
  /users/{id}/friend-requests:
    post:
      tags:
      - Заявки и дружба
      summary: Отправить заявку
      description: 'Тело должно отсутствовать. Отправитель берётся из сессии. Дружба возникает только после
        принятия. Новая заявка при исходящей pending даёт REQUEST_ALREADY_EXISTS, при встречной — INCOMING_REQUEST_EXISTS
        с error.details.friend_request_id, без автоматического принятия. Idempotency-Key обязателен: исходный
        результат (включая бизнес-ошибки) хранится 24 часа в пределах пользователя и операции. Тот же ключ/получатель
        возвращает прежний результат; другой получатель — IDEMPOTENCY_CONFLICT. Отмена, принятие или блокировка
        не меняют сохранённый ответ. Для нового действия создай новый ключ, для сетевого повтора сохраняй прежний.
        Текущая сессия проверяется при каждом повторе. Ошибки авторизации, заголовков/пути/тела и технические
        сбои не сохраняются.'
      operationId: sendFriendRequest
      security:
      - UserBearer: []
      parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
              examples:
                success:
                  value:
                    id: 33333333-3333-4333-8333-333333333333
                    status: pending
                    created_at: '2026-11-26T10:00:00Z'
        '400':
          description: 'Возможные error.code: `IDEMPOTENCY_KEY_REQUIRED`, `INVALID_IDEMPOTENCY_KEY`, `INVALID_REQUEST`,
            `SELF_ACTION`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                IDEMPOTENCY_KEY_REQUIRED:
                  $ref: '#/components/examples/IDEMPOTENCY_KEY_REQUIRED'
                INVALID_IDEMPOTENCY_KEY:
                  $ref: '#/components/examples/INVALID_IDEMPOTENCY_KEY'
                INVALID_REQUEST:
                  $ref: '#/components/examples/INVALID_REQUEST'
                SELF_ACTION:
                  $ref: '#/components/examples/SELF_ACTION'
        '401':
          $ref: '#/components/responses/UserSessionError'
        '403':
          description: 'Возможные error.code: `INTERACTION_BLOCKED`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                INTERACTION_BLOCKED:
                  $ref: '#/components/examples/INTERACTION_BLOCKED'
        '404':
          description: 'Возможные error.code: `PROFILE_NOT_FOUND`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                PROFILE_NOT_FOUND:
                  $ref: '#/components/examples/PROFILE_NOT_FOUND'
        '409':
          description: 'Возможные error.code: `IDEMPOTENCY_CONFLICT`, `ALREADY_FRIENDS`, `REQUEST_ALREADY_EXISTS`,
            `INCOMING_REQUEST_EXISTS`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                IDEMPOTENCY_CONFLICT:
                  $ref: '#/components/examples/IDEMPOTENCY_CONFLICT'
                ALREADY_FRIENDS:
                  $ref: '#/components/examples/ALREADY_FRIENDS'
                REQUEST_ALREADY_EXISTS:
                  $ref: '#/components/examples/REQUEST_ALREADY_EXISTS'
                INCOMING_REQUEST_EXISTS:
                  $ref: '#/components/examples/INCOMING_REQUEST_EXISTS'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /friend-requests:
    get:
      tags:
      - Заявки и дружба
      summary: Свои ожидающие заявки
      description: 'Только собственные pending-заявки: новые первыми, затем UUID по убыванию. direction обязателен.
        user — другая сторона заявки. Курсор связан с текущим пользователем и направлением.'
      operationId: listFriendRequests
      security:
      - UserBearer: []
      parameters:
      - name: direction
        in: query
        required: true
        schema:
          type: string
          enum:
          - incoming
          - outgoing
        example: incoming
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestPage'
              examples:
                success:
                  value:
                    items:
                    - id: 33333333-3333-4333-8333-333333333333
                      status: pending
                      created_at: '2026-11-26T10:00:00Z'
                      user:
                        id: 22222222-2222-4222-8222-222222222222
                        username: anna_books
                        avatar_url: null
                    next_cursor: null
        '400':
          description: 'Возможные error.code: `INVALID_DIRECTION`, `INVALID_LIMIT`, `INVALID_CURSOR`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                INVALID_DIRECTION:
                  $ref: '#/components/examples/INVALID_DIRECTION'
                INVALID_LIMIT:
                  $ref: '#/components/examples/INVALID_LIMIT'
                INVALID_CURSOR:
                  $ref: '#/components/examples/INVALID_CURSOR'
        '401':
          $ref: '#/components/responses/UserSessionError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /friend-requests/{id}/accept:
    post:
      tags:
      - Заявки и дружба
      summary: Принять заявку
