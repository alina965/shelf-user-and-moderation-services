      - Внутреннее API
      summary: Пакетно проверить доступ
      description: Только Collection и Community; section=collection разрешён только Collection. Возвращает
        1–100 решений в исходном порядке в одном снимке БД. Пустой/отсутствующий access_token означает гостя;
        переданный неверный токен даёт 401. Для collection обязательна visibility, для остальных разделов используется
        сохранённая privacy. Нужен доступ одновременно к профилю и разделу/коллекции. При allowed=false закрытый
        ресурс не выдаётся, при сбое — 503 всего пакета. is_friend отражает сохранённую дружбу, is_blocked
        — блокировку хотя бы в одну сторону; итоговый доступ определяется allowed. Существование коллекции
        и её владельца/видимость Collection проверяет в собственной БД.
